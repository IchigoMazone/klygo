[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "klygo"
version = "2.1.0"
description = "Unified high-performance Python toolkit for file operations, archives, configuration, dataset management, and zero-shot object detection pipelines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Trinh Nhu Nhat (IchigoMazone)", email = "nhattrinh2702@gmail.com" }
]
requires-python = ">=3.10,<4.0"
keywords = [
    "computer-vision",
    "object-detection",
    "dataset-curation",
    "data-mining",
    "image-preprocessing",
    "yolo",
    "grounding-dino",
    "klygo",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pillow>=11.0",
    "pydantic>=2.0",
    "python-box>=7.0",
    "pyyaml>=6.0",
    "tomlkit>=0.13",
    "tqdm>=4.66",
    "matplotlib>=3.5",
    "rich>=13.0",
]

[project.optional-dependencies]
locate-anything = [
    "torch>=2.7,<3.0",
    "transformers==4.57.1",
    "accelerate>=1.5.2",
    "torchvision>=0.22,<1.0",
    "peft",
    "decord==0.6.0",
    "lmdb>=1.7.5",
    "timm>=1.0.11",
]
torch = [
    "torch>=2.7,<3.0",
]
transformers = [
    "torch>=2.7,<3.0",
    "transformers>=4.50,<6.0",
]
ultralytics = [
    "ultralytics",
]
torchvision = [
    "torch>=2.7,<3.0",
    "torchvision>=0.22,<1.0",
]
keras-hub = [
    "keras-hub",
]
gpu-outputs = [
    "cupy-cuda12x[ctk]>=14,<15",
]
models = [
    "torch>=2.7,<3.0",
    "transformers>=4.50,<6.0",
    "ultralytics",
    "torchvision>=0.22,<1.0",
    "keras-hub",
]
py7zr = [
    "py7zr",
]
rarfile = [
    "rarfile",
]

[project.urls]
Homepage = "https://github.com/IchigoMazone/klygo"
Repository = "https://github.com/IchigoMazone/klygo"
Documentation = "https://github.com/IchigoMazone/klygo/tree/main/docs"
Issues = "https://github.com/IchigoMazone/klygo/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["klygo*"]
exclude = ["artifacts*", "benchmarks*", "data*", "docs*", "examples*", "test*", "tutorials*"]
namespaces = false

[tool.setuptools.package-data]
klygo = ["models/*.json"]
