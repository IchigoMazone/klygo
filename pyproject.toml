[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klygo"
version = "2.1.0"
description = "Unified high-performance Python toolkit for file operations, archives, configuration, dataset management, and zero-shot object detection pipelines."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Trinh Nhu Nhat (IchigoMazone)", email = "nhattrinh2702@gmail.com" }
]
requires-python = ">=3.10,<4.0"

dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pillow>=11.0",
    "pydantic>=2.0",
    "python-box>=7.0",
    "pyyaml>=6.0",
    "tomlkit>=0.13",
    "tqdm>=4.66",
    "matplotlib>=3.5",
    "rich>=13.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.7,<3.0",
]
transformers = [
    "torch>=2.7,<3.0",
    "transformers>=4.50,<6.0",
]
ultralytics = [
    "ultralytics",
]
torchvision = [
    "torch>=2.7,<3.0",
    "torchvision>=0.22,<1.0",
]
keras-hub = [
    "keras-hub",
]
models = [
    "torch>=2.7,<3.0",
    "transformers>=4.50,<6.0",
    "ultralytics",
    "torchvision>=0.22,<1.0",
    "keras-hub",
]
py7zr = [
    "py7zr",
]
rarfile = [
    "rarfile",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["klygo*"]
exclude = ["data*", "docs*", "test*"]
namespaces = false

[tool.setuptools.package-data]
klygo = ["models/*.json"]
