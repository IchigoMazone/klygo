name: Build & Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: pip install build twine && python -m build
      - name: Verify package metadata
        run: twine check --strict dist/*
      - name: Smoke test installed wheel in clean venv
        run: |
          python -m venv /tmp/klygo_wheel_test
          /tmp/klygo_wheel_test/bin/pip install dist/*.whl
          cd /tmp && /tmp/klygo_wheel_test/bin/python -c "import klygo; from klygo import archive, config, datasets, files, media, mining, models, outputs, postprocessing, preprocessing, utils, validators, visual; assert 'klygo_wheel_test' in klygo.__file__; print('Verified wheel:', klygo.__version__, klygo.__file__)"
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  upload_pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
