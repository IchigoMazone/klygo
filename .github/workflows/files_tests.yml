name: Core CI & Docs Audit

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  files:
    name: Core suite on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core package
        run: python -m pip install -e .
      - name: Run core unit tests (without optional ML stacks)
        run: python -c "import unittest; L=unittest.TestLoader(); S=unittest.TestSuite([L.discover(f'test/{m}', top_level_dir='.') for m in ('files','archive','config','datasets','media','mining','outputs','postprocessing','preprocessing','utils','validators','visual')] + [L.loadTestsFromName('test.models.test_optional_dependencies')]); raise SystemExit(0 if unittest.TextTestRunner(verbosity=2).run(S).wasSuccessful() else 1)"
      - name: Audit public APIs, docs, examples, and tutorials
        run: python .agents/skills/klygo-module-guides/scripts/audit_public_api.py --all
