name: Klygo v2 smoke tests

on:
  push:
    branches: [feature/khanh]
  pull_request:
    branches: [feature/khanh]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run offline public API tests
        run: python -m unittest test.test_v2_integration test.mining.test_operations -v
